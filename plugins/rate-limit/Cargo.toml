[package]
name = "rillane-plugin-rate-limit"
description = "P3-2 示例插件：令牌桶限速（plugin-loader.md §1.2 ABI）"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# 独立 workspace：wasm 专属 crate 不随宿主 workspace 编译（plugin-loader.md §7 P-load）
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
