[package]
name = "rillaned"
version = "0.1.0"
edition = "2021"

# 构建档位（RIL-040）：`full` 挂 wasmtime/JIT（WASM 插件中间件）。
# default = full 档；small/mobile 档须 `--no-default-features --features small`
# （cargo feature 叠加语义下，small 不关 default 仍是全量）——small 依赖图
# 无 wasmtime/JIT；obfs.plugins 声明在 small 档配置校验期点名硬错误。
[features]
default = ["full"]
full = ["rillane-runtime/plugins"]
small = []
mobile = []

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rillane-config = { path = "../../crates/rillane-config" }
rillane-core = { path = "../../crates/rillane-core" }
# 探测执行器 trait 实现（RIL-061 测试桩实现 ProbeExecutor 需要）
async-trait.workspace = true
rillane-platform = { path = "../../crates/rillane-platform" }
rillane-runtime = { path = "../../crates/rillane-runtime", default-features = false }
# 纯路由推演面（RIL-065 `/explain`：ExplainInput 入体 + RouteExplanation 出体）
rillane-routing = { path = "../../crates/rillane-routing" }
rillane-telemetry = { path = "../../crates/rillane-telemetry" }
rillane-mesh = { path = "../../crates/rillane-mesh" }
rillane-subscription = { path = "../../crates/rillane-subscription" }

[dev-dependencies]
rcgen.workspace = true
# 观测轮（plugin-loader.md §0）：/plugins/stats 启用形测试以最小 wat 内联
# 模块产出 .wasm 落盘；版本随 wasmtime 所引（Cargo.lock wat 1.261.0）
wat = "1.261"
