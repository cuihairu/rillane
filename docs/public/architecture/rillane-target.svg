<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc"><title id="title">Rillane — proposed target architecture / 目标方案</title><desc id="desc">所有虚线框均为目标边界，未整体实现；复用现有模块，按迁移门禁逐项交付。 Solid green arrows: data. Dashed blue: configuration/control. Dashed amber: feedback. This is an architectural abstraction, not every call or packet.</desc><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#197569"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3469b0"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b36b20"/></marker></defs><rect width="1600" height="1030" fill="#f4f7f8"/><text x="50" y="64" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="34" font-weight="700" fill="#172c38">Rillane — proposed target architecture / 目标方案</text><text x="50" y="106" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" font-weight="400" fill="#526674">所有虚线框均为目标边界，未整体实现；复用现有模块，按迁移门禁逐项交付。</text><text x="50" y="155" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" font-weight="600" fill="#526674">CONTROL / 配置与生命周期</text><text x="50" y="415" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" font-weight="600" fill="#526674">DATA / 连接与数据报</text><text x="50" y="705" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" font-weight="600" fill="#526674">SERVICES / 共享服务与边界</text><polyline points="395,520 427,520" fill="none" stroke="#197569" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/><polyline points="780,520 812,520" fill="none" stroke="#197569" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/><polyline points="1165,520 1197,520" fill="none" stroke="#197569" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/><polyline points="395,255 427,255" fill="none" stroke="#3469b0" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" stroke-dasharray="9 6"/><polyline points="780,255 812,255" fill="none" stroke="#3469b0" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" stroke-dasharray="9 6"/><polyline points="992,350 992,426" fill="none" stroke="#3469b0" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" stroke-dasharray="9 6"/><text x="1010" y="391" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="17" font-weight="400" fill="#3469b0">policy / 策略</text><polyline points="222,725 222,641 607,641 607,620" fill="none" stroke="#3469b0" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" stroke-dasharray="9 6"/><polyline points="992,725 992,620" fill="none" stroke="#b36b20" stroke-width="3" stroke-linejoin="round" marker-end="url(#feedback)" stroke-dasharray="9 6"/><text x="1010" y="676" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="17" font-weight="400" fill="#b36b20">quality / 质量</text><rect x="50" y="175" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="70" y="211" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Sources / 配置来源</text><text x="70" y="251" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">Clash / Mihomo + local rules</text><text x="70" y="280" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">provider-scoped stable IDs</text><text x="70" y="309" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">sources never own local policy</text><rect x="435" y="175" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="455" y="211" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Compiler / 配置编译</text><text x="455" y="251" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">canonical typed IR + provenance</text><text x="455" y="280" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">validate refs / OS capabilities</text><text x="455" y="309" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">last-known-good on failure</text><rect x="820" y="175" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="840" y="211" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Generation / 配置代际</text><text x="840" y="251" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">immutable validated snapshot</text><text x="840" y="280" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">prepare → apply → publish</text><text x="840" y="309" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">new flows pin one generation</text><rect x="1205" y="175" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="1225" y="211" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Control / 平台宿主</text><text x="1225" y="251" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">daemon / Android service</text><text x="1225" y="280" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">Apple Packet Tunnel extension</text><text x="1225" y="309" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">UI / IPC / lifecycle adapters</text><rect x="50" y="435" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="70" y="471" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">CapturePort / 接管端口</text><text x="70" y="511" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">socket / packet-batch inputs</text><text x="70" y="540" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">Linux / OpenWrt / Wintun</text><text x="70" y="569" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">Android VPN / Apple packetFlow</text><rect x="435" y="435" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="455" y="471" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Flow / 流与应用上下文</text><text x="455" y="511" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">TCP stream / UDP association</text><text x="455" y="540" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">OwnerResolver + DNS context</text><text x="455" y="569" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">known / unknown / unsupported</text><rect x="820" y="435" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="840" y="471" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Policy / 并行场景</text><text x="840" y="511" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">process + domain → route plan</text><text x="840" y="540" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">game / web objectives coexist</text><text x="840" y="569" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">target + queue + fail policy</text><rect x="1205" y="435" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="1225" y="471" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Session / 会话执行</text><text x="1225" y="511" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">pin endpoint / bounded queues</text><text x="1225" y="540" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">direct / standard proxy</text><text x="1225" y="569" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">optional mesh adapter</text><rect x="50" y="725" width="345" height="185" rx="12" fill="#fff7e9" stroke="#b36b20" stroke-width="2" stroke-dasharray="9 5"/><text x="70" y="761" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Ports / 平台服务</text><text x="70" y="801" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">DNS / owner / socket bypass</text><text x="70" y="830" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">route transaction / permissions</text><text x="70" y="859" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="2