175" width="345" height="185" rx="12" fill="#ffffff" stroke="#adc3cc" stroke-width="2"/><text x="455" y="211" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Compile / 装配</text><text x="455" y="251" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">config + hub/executor</text><text x="455" y="280" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">解析、校验、实例装配</text><text x="455" y="309" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">不是浏览器 HTTP 缓存</text><rect x="820" y="175" width="345" height="185" rx="12" fill="#ffffff" stroke="#adc3cc" stroke-width="2"/><text x="840" y="211" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Policy / 策略对象</text><text x="840" y="251" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">rules + proxy groups</text><text x="840" y="280" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">select / url-test / fallback</text><text x="840" y="309" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">providers 动态更新成员</text><rect x="1205" y="175" width="345" height="185" rx="12" fill="#ffffff" stroke="#adc3cc" stroke-width="2"/><text x="1225" y="211" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Control / 管理</text><text x="1225" y="251" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">REST controller / clients</text><text x="1225" y="280" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">配置、选择与连接观测</text><text x="1225" y="309" font-family="'Noto Sans CJK SC',