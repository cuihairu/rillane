" fill="#526674">group → concrete adapter</text><text x="840" y="569" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">TCP 与 UDP 能力分别检查</text><rect x="1205" y="435" width="345" height="185" rx="12" fill="#ffffff" stroke="#adc3cc" stroke-width="2"/><text x="1225" y="471" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Forward / 出站转发</text><text x="1225" y="511" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">protocol adapters / dialers</text><text x="1225" y="540" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">DIRECT / proxy / dialer chain</text><text x="1225" y="569" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">session / UDP NAT state</text><rect x="50" y="725" width="345" height="185" rx="12" fill="#ffffff" stroke="#adc3cc" stroke-width="2"/><text x="70" y="761" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">DNS / 名称服务</text><text x="70" y="801" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">resolver / fake-IP mapping</text><text x="70" y="830" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">域名上下文与地址关联</text><text x="70" y="859" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">DNS 不是 HTTP 内容解密</text><rect x="435" y="725" width="345" height="185" rx="12" fill="#ffffff" stroke="#adc3cc" stroke-width="2"/><text x="455" y="761" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Platform / 系统差异</text><text x="455" y="801" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">process lookup / routing</text><text x="455" y="830" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">设备与权限适配</text><text x="455" y="859" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">TUN 本身不携带 PID</text><rect x="820" y="725" width="345" height="185" rx="12" fill="#ffffff" stroke="#adc3cc" stroke-width="2"/><text x="840" y="761" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Health / 质量观测</text><text x="840" y="801" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">provider health checks</text><text x="840" y="830" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">URL-test / connection stats</text><text x="840" y="859" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">健康不等于游戏端到端 RTT</text><rect x="1205" y="725" width="345" height="185" rx="12" fill="#ffffff" stroke="#adc3cc" stroke-width="2"/><text x="1225" y="761" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="24" font-weight="650" fill="#172c38">Boundary / 吸收重点</text><text x="1225" y="801" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">订阅、规则、选择解耦</text><text x="1225" y="830" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">动态成员与策略语义</text><text x="1225" y="859" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="20" font-weight="400" fill="#526674">逐项兼容，不随机替代回退</text><polyline points="60,958 130,958" fill="none" stroke="#197569" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/><text x="145" y="965" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" font-weight="400" fill="#526674">data</text><polyline p