<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc"><title id="title">Six platforms — shared core, explicit capability boundaries</title><desc id="desc">同一个 Rust 数据面设计；系统 helper、VPN service 或 extension 可以处于独立进程。 Solid green arrows: data. Dashed blue: configuration/control. Dashed amber: feedback. This is an architectural abstraction, not every call or packet.</desc><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#197569"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3469b0"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b36b20"/></marker></defs><rect width="1600" height="1220" fill="#f4f7f8"/><text x="50" y="64" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="34" font-weight="700" fill="#172c38">Six platforms — shared core, explicit capability boundaries</text><text x="50" y="106" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" font-weight="400" fill="#526674">同一个 Rust 数据面设计；系统 helper、VPN service 或 extension 可以处于独立进程。</text><text x="255" y="158" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#526674">CAPTURE / 接管</text><text x="695" y="158" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#526674">IDENTITY / 应用归因</text><text x="1135" y="158" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#526674">LIFECYCLE / 验收边界</text><text x="50" y="232" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="26" font-weight="700" fill="#172c38">Linux</text><text x="50