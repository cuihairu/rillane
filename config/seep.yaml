control:
  api_bind: 127.0.0.1:9090
  uds_path: null
  admin_token: seep

telemetry:
  log_level: info
  enable_metrics: true
  enable_tracing: false

ingress:
  - name: socks-in
    type: socks5
    bind: 0.0.0.0:7890
    auth:
      - username: demo
        password: demo

egress:
  - name: direct-main
    type: direct

routing:
  default_node: direct-main
  groups:
    - name: auto
      strategy: latency
      members:
        - direct-main
  rules:
    - name: cn
      target: auto
      matches:
        - type: geoip
          country: CN
