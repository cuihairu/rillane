control:
  api_bind: 127.0.0.1:9090
  uds_path: null
  admin_token: seep

telemetry:
  log_level: info
  enable_metrics: true
  enable_tracing: false

ingress:
  - name: socks-in
    type: socks5
    bind: 0.0.0.0:7890
    auth:
      - username: demo
        password: demo
    # 入口级 UDP 覆盖（socks5/mixed 可用）：缺省继承 udp.enabled；
    # true/false 显式开/关该入口的 CMD 0x03（显式 true 且全局关时构建期打 WARN）
    # udp_enabled: true
  # - name: http-in
  #   type: http
  #   bind: 0.0.0.0:7891
  #   auth:                          # Basic 认证（凭据表非空即强制；缺省 = 匿名放行）
  #     - username: demo
  #       password: demo
  #   bearer_tokens: []              # Bearer Token（Proxy-Authorization: Bearer；与 auth 并列任一通过，缺省 = 匿名）
  # - name: mixed-in
  #   type: mixed
  #   bind: 0.0.0.0:7892
  #   udp_enabled: true
  #   # auth/bearer_tokens 与 http 入口同语义（auth 兼顾 socks5 分支 RFC 1929；bearer_tokens 仅 http 分支）

egress:
  - name: direct-main
    type: direct
