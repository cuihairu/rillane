# 双场景并发走查配置（seep-d1 会话独占；tun-dataplane.md §4.2 双场景验收）：
# 与并行会话的 seep0 实例（1.1.1.1/8.8.8.8）目标/端口/设备全不相交。
# - 网页场景：python3 的 TCP 流（默认 web-node——替身即浏览器进程）
# - 游戏场景：curl 进程的流走 game-node（进程分流；替身即游戏客户端进程名
#   如 cs2/dota2/wow.exe）+ UDP 123 端口分流走 game-node（替身即游戏 UDP 端口段）
# 路由面 include 只收两个测试目标 /32（不接管默认路由——走查机器自用）：
# 1.0.0.1（网页/游戏 TCP 两腿同目标并发，唯一差异 = 进程名）+
# 162.159.200.1（NTP UDP 腿；本网 53 直连被墙，此目标实测可达）
control:
  api_bind: 127.0.0.1:19095
  uds_path: null
  admin_token: demo

telemetry:
  log_level: debug
  enable_metrics: true
  enable_tracing: true

ingress:
  - name: socks-in
    type: socks5
    bind: 127.0.0.1:17895

egress:
  - name: web-node
    type: direct
  - name: game-node
    type: direct

routing:
  default_node: web-node
  groups:
    - name: auto
      strategy: latency
      members:
        - web-node
  rules:
    - name: game-process
      target: game-node
      matches:
        - type: process
          values: ["curl"]
    - name: game-udp-port
      target: game-node
      matches:
        - type: port
          values: [123]

udp:
  enabled: true

network:
  mode: tun
  tun:
    name: seepd1
    mtu: 1400
    ipv4: 10.112.0.1/24
  routing:
    include:
      - 1.0.0.1/32
      - 162.159.200.1/32
