name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 全部 job 跑现有自托管 runner（标签集 self-hosted+rillane，
  # 一实例一并发，主机安装路径与实例名不依赖仓库名）：私有仓走 GitHub-hosted 分钟数被
  # 账号计费拦死（job 秒失败 "recent account payments have failed"），自托管
  # 不耗计费分钟。扩容=runner 主机再加同标签实例。
  test:
    name: Test
    runs-on: [self-hosted, rillane]
    # nightly 工具链每日漂移，第三方依赖（defguard_boringtun 等）撞 rustc ICE
    # 不可控——nightly 失败标黄不置红、不连坐 stable/beta；stable/beta 红照红
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      # 同理：单成员失败不取消其余（此前默认 fail-fast 把 stable/beta 遮成
      # cancelled，真实信号被 nightly 连坐掩盖）
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Install Rust
      # action ref 钉 stable 分支（与 coverage/audit/cross 三 job 同口径）：
      # @master 随上游主分支滚动，action 自身代码变更即可漂移；toolchain
      # 仍按矩阵跑 stable/beta/nightly 通道，通道覆盖面不变
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build workspace
      run: cargo build --verbose --workspace

    - name: Run tests
      run: cargo test --verbose --workspace --all-features

  # RIL-040 small/mobile 构建面：test job 的 --all-features 恒开 plugins，
  # 看不见 small 档 cfg 分支——本 job 单独把三档裁剪面编译 + 钉依赖图断言
  # （small 依赖图无 wasmtime/JIT 是验收项，不钉 CI 就会无声倒退）。
  small:
    name: Small build (no wasmtime)
    runs-on: [self-hosted, rillane]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check small/mobile profiles
      run: |
        cargo check -p rillaned --no-default-features --features small
        cargo check -p rillane-ffi --no-default-features --features mobile
        cargo check -p rillanectl --no-default-features --features small

    - name: Assert no wasmtime in small dep graph
      # -c 计数取 0 为过；非零时先打命中行再退 1，失败现场不丢
      run: |
        hits=$(cargo tree -p rillaned --no-default-features --features small -e normal | grep -ci wasmtime || true)
        if [ "$hits" != "0" ]; then
          cargo tree -p rillaned --no-default-features --features small -e normal | grep -i wasmtime
          exit 1
        fi

  coverage:
    name: Code coverage
    runs-on: [self-hosted, rillane]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      # 版本钉死 + --locked 钉安装面依赖：无 pin 的 cargo install 每次按当下
      # registry 重新解析，上游新发版即可漂移破坏可复现性。0.9.1 =
      # 2026-10-11 自托管 runner 实证绿版本（run 38109201127 coverage job）
      run: cargo install cargo-llvm-cov --version 0.9.1 --locked

    - name: Cache dependencies
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Generate coverage report
      # 行覆盖率硬门禁：低于 80% 直接失败本 job（本地同命令必须先绿再推）。
      # 只做上传不做门禁等于没有门禁——报告再好看也不会拦住倒退。
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        files: lcov.info
        # 上传尽力而为：仓库未配置 CODECOV_TOKEN secret，codecov v4 起
        # GHA tokenless 上传被拒（"Token required"）——缺 token 只降级上传，
        # 不置红 CI；覆盖率报告生成（llvm-cov 步）失败仍会失败本 job。
        fail_ci_if_error: false

  audit:
    name: Security audit
    runs-on: [self-hosted, rillane]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      # 版本钉死 + --locked 钉安装面依赖（同 coverage install 步口径）。
      # 0.22.2 = 2026-10-11 自托管 runner 实证绿版本（run 38109201127 audit job）
      run: cargo install cargo-audit --version 0.22.2 --locked

    - name: Run security audit
      # RUSTSEC-2026-0258（h2）已随 hyper 0.14 → 1.x 迁移清零。
      # 定向 ignore（逐条核实非误报，新告警出现时按条目处理）：
      # - RUSTSEC-2024-0370 postgres：tokio-postgres 生态无 1.x 迁移、已停维护；仅订阅同步面使用，待换 sqlx
      # - RUSTSEC-2026-0486 rustix xattr unsound：零长 buffer 误标初始化；随 rustix 1.x 升级跟进
      run: cargo audit --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2026-0486

  msrv:
    name: Check MSRV
    runs-on: [self-hosted, rillane]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable  # MSRV 随锁上调：wasmtime 49.0.2 / cranelift-* 0.136=1.96、smoltcp 0.14=1.91（1.88 基线在 wasmtime 49 入锁后已红；前值 1.88=shadowsocks 1.24.0 / time 0.3.47 / serde_with 3.21）

    - name: Cache dependencies
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check with MSRV
      run: cargo check --all

  cross-compile:
    name: Cross compile
    runs-on: [self-hosted, rillane]
    strategy:
      # 单目标失败不连环取消其余目标（此前 fail-fast 默认把另外 4 个
      # 目标遮在 cancelled 态，掩盖真实信号）
      fail-fast: false
      matrix:
        # darwin 不在列：Apple SDK 再分发受 Apple 许可限制，linux 上无法
        # 合法交叉编译（cross 官方亦无 darwin 镜像）——darwin 侧检查待
        # macos runner 原生跑（P3-3 打包面，todo 待派已登记）
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          # P3-3 OpenWrt musl 面（musl 静态包产线，platforms/openwrt）；
          # mips/mipsel 不入列——rust 1.8x 起无 32 位 mips musl 预编译 std，
          # 且 aws-lc-sys 不支持该架构（见 platforms/openwrt/README.md）
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      uses: taiki-e/install-action@v2.87.30
      with:
        tool: cross

    - name: Cache dependencies
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        # 键含 matrix.target：不同目标的 target/ 产物互异，
        # 共用一键会互相覆盖缓存
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Check cross compilation
      # bare `cargo check --target` 在 linux host 无 C 交叉工具链——
      # ring/aws-lc-sys 的 build script 会以 host cc 编 C 并打目标专属
      # 旗标必炸（此前 darwin 15 连红的根因）；cross 以 docker 镜像携带
      # 各目标的完整 C 工具链
      run: cross check --target ${{ matrix.target }}

  docker:
    name: Docker build
    runs-on: [self-hosted, rillane]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build Docker image
      run: |
        docker build -t rillane:test -f Dockerfile .
        docker run --rm rillane:test --version
