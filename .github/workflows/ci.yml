name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build workspace
      run: cargo build --verbose --workspace

    - name: Run tests
      run: cargo test --verbose --workspace --all-features

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Generate coverage report
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: lcov.info
        # 上传尽力而为：仓库未配置 CODECOV_TOKEN secret，codecov v4 起
        # GHA tokenless 上传被拒（"Token required"）——缺 token 只降级上传，
        # 不置红 CI；覆盖率报告生成（llvm-cov 步）失败仍会失败本 job。
        fail_ci_if_error: false

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      # RUSTSEC-2026-0258（h2 <0.4.16 空 DATA 帧放大）已随 hyper 0.14 → 1.x
      # 迁移清零（h2 ≥0.4.16 入锁），无 ignore 项；新告警出现时按条目定向处理
      run: cargo audit

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.88.0  # MSRV 随锁上调：shadowsocks 1.24.0=1.88 / time 0.3.47=1.88 / serde_with 3.21=1.88（1.75 基线在旧锁已红）

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check with MSRV
      run: cargo check --all

  cross-compile:
    name: Cross compile
    runs-on: ubuntu-latest
    strategy:
      # 单目标失败不连环取消其余目标（此前 fail-fast 默认把另外 4 个
      # 目标遮在 cancelled 态，掩盖真实信号）
      fail-fast: false
      matrix:
        # darwin 不在列：Apple SDK 再分发受 Apple 许可限制，linux 上无法
        # 合法交叉编译（cross 官方亦无 darwin 镜像）——darwin 侧检查待
        # macos runner 原生跑（P3-3 打包面，todo 待派已登记）
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        # 键含 matrix.target：不同目标的 target/ 产物互异，
        # 共用一键会互相覆盖缓存
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Check cross compilation
      # bare `cargo check --target` 在 linux host 无 C 交叉工具链——
      # ring/aws-lc-sys 的 build script 会以 host cc 编 C 并打目标专属
      # 旗标必炸（此前 darwin 15 连红的根因）；cross 以 docker 镜像携带
      # 各目标的完整 C 工具链
      run: cross check --target ${{ matrix.target }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t seep:test -f Dockerfile .
        docker run --rm seep:test --version