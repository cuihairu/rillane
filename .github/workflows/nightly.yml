name: Daily Build (nightly)

on:
  schedule:
    # 每日 02:00 UTC（10:00 CST）——在 CI 高峰后错峰
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    # 门禁：主 CI 最新一轮必须绿（Test 全工具链）才允许 nightly 发布。
    # 若红 → nightly 跳过发布并显式失败（不留「今天没有构建」的静默）。
    name: CI gate
    runs-on: [self-hosted, rillane]
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
    - name: Check latest main CI conclusion
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        R=$(gh run list -R "${{ github.repository }}" --branch main \
          --workflow CI --limit 1 --json conclusion \
          --jq '.[0].conclusion // "none"')
        echo "latest CI conclusion: $R"
        if [ "$R" = "success" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: [self-hosted, rillane]
    strategy:
      fail-fast: false
      matrix:
        # 与 ci.yml cross-compile 矩阵同源（darwin 待原生 runner，同 ci 注记）
        target:
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-unknown-linux-musl
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Build release binaries
      run: cross build --release --target ${{ matrix.target }} --workspace

    - name: Stage artifacts
      run: |
        STAGE="stage/${{ matrix.target }}"
        mkdir -p "$STAGE"
        TDIR="target/${{ matrix.target }}/release"
        for bin in rillaned rillanectl rillane-mcp; do
          EXT=""
          [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ] && EXT=".exe"
          [ -f "$TDIR/$bin$EXT" ] && cp "$TDIR/$bin$EXT" "$STAGE/"
        done
        ls -la "$STAGE"

    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: rillane-${{ matrix.target }}
        path: stage/${{ matrix.target }}/
        retention-days: 3

  publish:
    name: Publish nightly
    needs: build
    runs-on: [self-hosted, rillane]
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8.0.2
      with:
        path: artifacts/

    - name: Organize and checksum
      run: |
        mkdir -p release
        for d in artifacts/*/; do
          tgt=$(basename "$d")
          mkdir -p "release/rillane-nightly-$tgt"
          cp "$d"* "release/rillane-nightly-$tgt/"
        done
        cd release
        # 每平台目录打 tar（Windows 面目录保留 .exe 即可，不 zip 免工具差异）
        for d in rillane-nightly-*/; do
          tar czf "${d%/}.tar.gz" "${d%/}"
        done
        sha256sum *.tar.gz > SHA256SUMS
        ls -la

    - name: Update rolling nightly release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG=nightly
        # 固定 rolling tag：先删旧 release（资产随删），再重建并上传
        gh release delete "$TAG" -R "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$TAG" -R "${{ github.repository }}" \
          --title "rillane nightly (rolling)" \
          --notes "每日构建（rolling，只保留最新一版）。构建自 main@$(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo 'see SHA256SUMS')" \
          --prerelease \
          release/*.tar.gz release/SHA256SUMS
