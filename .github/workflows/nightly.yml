name: Daily Build (nightly)

on:
  schedule:
    # 每日 02:00 UTC（10:00 CST）——在 CI 高峰后错峰
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    # 门禁：主 CI 最新一轮必须绿（Test 全工具链）才允许 nightly 发布。
    # 若红 → nightly 跳过发布并显式失败（不留「今天没有构建」的静默）。
    name: CI gate
    runs-on: [self-hosted, rillane]
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
    - name: Check latest main CI conclusion
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # gh is not installed on this self-hosted runner (2026-11-22 gate
        # died with 'gh: command not found', exit 127). Query the REST API
        # via curl/wget and extract the conclusion with grep/sed — no gh,
        # no jq dependency. First entry of the ci.yml run list on main is
        # the latest CI run; null conclusion (run in progress) fails the
        # gate just like the old gh fallback "none" did.
        url="https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&per_page=1"
        if command -v curl >/dev/null 2>&1; then
          payload=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url")
        else
          payload=$(wget -qO- --header="Authorization: Bearer $GH_TOKEN" --header="Accept: application/vnd.github+json" "$url")
        fi
        R=$(printf '%s' "$payload" | grep -o '"conclusion": *"[a-z_]*"' | head -1 | sed 's/.*: *"//;s/"$//')
        echo "latest CI conclusion: ${R:-none}"
        if [ "$R" = "success" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: [self-hosted, rillane]
    strategy:
      fail-fast: false
      matrix:
        # 与 ci.yml cross-compile 矩阵同源（darwin 待原生 runner，同 ci 注记）
        target:
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-unknown-linux-musl
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Build release binaries
      run: cross build --release --target ${{ matrix.target }} --workspace

    - name: Stage artifacts
      run: |
        STAGE="stage/${{ matrix.target }}"
        mkdir -p "$STAGE"
        TDIR="target/${{ matrix.target }}/release"
        for bin in rillaned rillanectl rillane-mcp; do
          EXT=""
          [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ] && EXT=".exe"
          [ -f "$TDIR/$bin$EXT" ] && cp "$TDIR/$bin$EXT" "$STAGE/"
        done
        ls -la "$STAGE"

    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: rillane-${{ matrix.target }}
        path: stage/${{ matrix.target }}/
        retention-days: 3

  publish:
    name: Publish nightly
    needs: build
    runs-on: [self-hosted, rillane]
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8.0.2
      with:
        path: artifacts/

    - name: Organize and checksum
      run: |
        mkdir -p release
        for d in artifacts/*/; do
          tgt=$(basename "$d")
          mkdir -p "release/rillane-nightly-$tgt"
          cp "$d"* "release/rillane-nightly-$tgt/"
        done
        cd release
        # 每平台目录打 tar（Windows 面目录保留 .exe 即可，不 zip 免工具差异）
        for d in rillane-nightly-*/; do
          tar czf "${d%/}.tar.gz" "${d%/}"
        done
        sha256sum *.tar.gz > SHA256SUMS
        ls -la

    - name: Update rolling nightly release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # gh 不可用（自托管 runner 无 gh，2026-11-22 gate 'gh: command not found'
        # 实证；此步此前从未跑到过，同样会 127）。改走 REST API：
        # 删旧 release -> 建新 rolling release（tag 不存在则自动在默认分支建）->
        # 逐个上传资产。curl 必须存在（构建链路已依赖网络工具）。
        API="https://api.github.com/repos/${{ github.repository }}"
        AUTH="Authorization: Bearer $GH_TOKEN"
        command -v curl >/dev/null || { echo 'curl not found on runner' >&2; exit 127; }
        RID=$(curl -sf -H "$AUTH" "$API/releases/tags/nightly" \
              | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*' || true)
        if [ -n "${RID:-}" ]; then
          curl -sf -X DELETE -H "$AUTH" "$API/releases/$RID"
        fi
        RID=$(curl -sf -X POST -H "$AUTH" -H 'Accept: application/vnd.github+json' \
          -d '{"tag_name":"nightly","name":"rillane nightly (rolling)","prerelease":true,"body":"daily rolling build; only latest kept. See SHA256SUMS"}' \
          "$API/releases" | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*')
        test -n "$RID"
        for f in release/*.tar.gz release/SHA256SUMS; do
          curl -sf -X POST -H "$AUTH" --data-binary @"$f" \
            "$API/releases/$RID/assets?name=$(basename "$f")" >/dev/null
        done
