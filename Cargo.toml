[workspace]
members = [
    "crates/seep-core",
    "crates/seep-config",
    "crates/seep-routing",
    "crates/seep-protocols",
    "crates/seep-telemetry",
    "crates/seep-platform",
    "crates/seep-runtime",
    "apps/seepd",
    "apps/seepctl",
    "crates/seep-mesh",
    "crates/seep-subscription",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Seep Contributors"]
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }
thiserror = "1.0"
bytes = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
rand = "0.8"
hyper = { version = "0.14", features = ["full"] }
serde_urlencoded = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
notify = { version = "8.0", features = ["serde"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
regex = "1.10"
url = "2.5"
dashmap = "6.0"
petgraph = "0.6"
whoami = "1.5"
num_cpus = "1.16"
serde_with = "3.8"
# Protocol dependencies
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
tokio-socks = "0.5"
shadowsocks = "1.21"
httparse = "1.9"
http = "1.1"
pin-project-lite = "0.2"
hysteria2 = "0.1.6"
