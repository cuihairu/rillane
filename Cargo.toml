[workspace]
members = [
    "crates/rillane-core",
    "crates/rillane-config",
    "crates/rillane-routing",
    "crates/rillane-app",
    "crates/rillane-protocols",
    "crates/rillane-telemetry",
    "crates/rillane-platform",
    "crates/rillane-runtime",
    "apps/rillaned",
    "apps/rillanectl",
    "apps/rillane-mcp",
    "crates/rillane-mesh",
    "crates/rillane-subscription",
    "crates/rillane-ffi",
    "crates/rillane-plugins",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Rillane Contributors"]
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = { version = "0.8", features = ["preserve_order"] }
thiserror = "1.0"
bytes = "1.0"
# TUN 用户态 TCP 栈（tun-dataplane.md §2.4 T4）：std=std::time 基时序、
# medium-ip=纯 IP 媒质（TUN IFF_NO_PI 无以太头）、socket-tcp=TCP 终结面、
# proto-ipv4=IPv4 报文面（medium-ip 不隐含之，缺则 Ipv4Address/IpCidr 编译面不在）、
# async=socket waker 注册（register_recv/send_waker 受 cfg(feature="async") 门控，
# §2.9 SmolTcpStream 双缓冲唤醒面的支撑）
smoltcp = { version = "0.14", features = ["std", "medium-ip", "socket-tcp", "socket-udp", "socket-dns", "proto-ipv4", "async"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
rand = "0.8"
# hyper 1.x（待派 2026-10-02 迁移：hyper 0.14 唯一引入路径 h2 0.3 <0.4.16
# RUSTSEC-2026-0258 空帧放大；control plane 仅用 http1 server 面）
hyper = { version = "1.5", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-auto", "server-graceful", "tokio"] }
http-body-util = "0.1"
# gRPC 传输面（outbound/grpc.rs）：trojan/vless/vmess grpc 单流隧道；
# 版本随 hyper 1.x 同源 h2 0.4（RUSTSEC-2026-0258 ≥0.4.16 已在锁）
h2 = "0.4"
serde_urlencoded = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
notify = { version = "8.0", features = ["serde"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
# Snell v4 记录密钥派生（outbound/snell.rs）：Argon2id(psk, salt, t=3, m=8KiB, p=1, 32B)[:16]
# ——仅用作 KDF，PHC 口令串面（password-hash/getrandom）在此无用，故关默认特性
# 只留 alloc（hash_password_into 的唯二 cfg 门控）
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# SSH-2 出站（outbound/ssh.rs）：russh 客户端面（连接/认证/direct-tcpip 通道流）
# + ssh-key 私钥解析与 host key SHA256 指纹（rc 线漂移，钉死 rc.12；
# russh::keys 即同一 crate 再导出）
russh = "0.65"
ssh-key = "=0.7.0-rc.12"
# Tor 出站（outbound/tor.rs，RIL-114）：arti-client 嵌入式客户端面（引导/电路/出口流）。
# 默认特性拉 native-tls(OpenSSL)，本仓纯 rustls，故关默认只留 tokio+rustls+compression；
# rustls provider 经本仓 [patch.crates-io] rustls fork 的特性并集解析。
# tor-chanmgr 只为 ProxyProtocol（arti 自家的通道前置代理 URI 解析器）做构造期具名校验。
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "compression"] }
tor-chanmgr = "0.48"
tor-rtcompat = "0.48"
# tor-dirmgr→rusqlite 默认链系统 libsqlite3（-lsqlite3）：无头/交叉面无该系统库即链接炸
# （2026-11-19 CI coverage 腿 6 个测试目标 `unable to find library -lsqlite3`）。直挂
# bundled 特性让 libsqlite3-sys 从源码编 SQLite，链接不再依赖宿主机安装面，交叉目标
# 同步受益；版本对齐锁内 0.38，仅特性面变更
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
# QUIC Initial 解密（G0-3 sniff）：HKDF-SHA256 派生 Initial 密钥
hkdf = "0.12"
regex = "1.10"
url = "2.5"
dashmap = "6.0"
petgraph = "0.6"
whoami = "1.5"
num_cpus = "1.16"
serde_with = "3.8"
# Protocol dependencies
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
tokio-socks = "0.5"
# default-features=false：弃默认 hickory-dns（DNS 子系统）——出口连接器只用
# config/context/crypto/relay 核心，hostname 解析走 shadowsocks 内建 tokio 回退；
# 顺带 hickory-resolver/hickory-proto 出锁（Dependabot GHSA-3v94-mw7p-v465 / GHSA-q2qq-hmj6-3wpp）
# aead-cipher-2022：SS2022 候选算法面（RIL-131 算法矩阵——
# 2022-blake3-aes-128/256-gcm、2022-blake3-chacha20-poly1305）
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher", "aead-cipher-2022"] }
httparse = "1.9"
http = "1.1"
pin-project-lite = "0.2"
# Hysteria2 UDP 中继面（RIL-133）：官方 UDPMessage 数据报协议自写——hysteria2
# crate 已出依赖（RIL-138 起 TCP 面亦自写，其 connect() 端点句柄缺陷见
# protocol-backends.md#hysteria2）；载具单版本入锁
quinn = "0.11.9"
h3 = "0.0.8"
h3-quinn = "0.0.10"
# AnyTLS（RIL-106）：会话复用代理——TLS 拨号/会话认证由调用方实现（Dialer
# 闭包），库承载会话帧/多路复用/填充与 UoT；default-features=false 弃 CLI 面
# （clap/env_logger/ctrlc2/ffi/panel-sync 均不入库）；server 特性仅测试对端用
# （rillane-protocols dev-dependencies 追加，resolver v2 下不泄漏进生产构建）
anytls = { version = "0.5", default-features = false, features = ["client"] }
# ShadowQUIC（RIL-118）：协议自身 Rust 实现的库承载出站（唯一 crates.io
# 落点）——客户端面直连路径（ShadowQuicClient::new → get_conn →
# squic::outbound::connect_tcp）；评估与探针留证 protocol-backends.md
# #shadowquic；伴生 shadowquic-macros（线格式 derive）随行
shadowquic = "0.4.12"
# OpenVPN（RIL-122）：库承载出站——corevpn-protocol 0.6.0（MIT OR
# Apache-2.0，2026-03-05；协议会话/双角色/TLS 面/KeyMethodV2/PUSH_REPLY），
# 依赖 corevpn-crypto（PRF/KeyMaterial/HmacAuth/CipherSuite）与 corevpn-core
# （仅 CoreError）。评估与标准对端互通留证 protocol-backends.md#openvpn；
# rustls 经本仓 [patch.crates-io] fork 统一解析
corevpn-protocol = "0.6"
corevpn-crypto = "0.6"
# Tailscale（RIL-123）：库承载出站——tailscale 0.7.1（tailscale-rs，
# BSD-3-Clause，纯 Rust；Device::tcp_connect -> netstack::TcpStream，
# AsyncRead/AsyncWrite 经 ts_netstack_smoltcp 的 tokio 特性）。载具
# ts_tls_util 骑 tokio-rustls 0.26（→rustls 0.23，经本仓
# [patch.crates-io] fork 统一解析）；用户态数据面=ts_netstack_smoltcp，
# 与 OpenConnect/OpenVPN 三层桥同构。评估留证 protocol-backends.md#tailscale
tailscale = "0.7"
# 载具子层 ts_control：启用 insecure-keyfetch 使控制面 key 获取沿用用户给定的
# URL scheme——否则载具无条件把 key URL 改写成 https（ts_control::fetch_control_key），
# 自托管 headscale 的明文 http 控制面会 TLS 握手失败（RIL-123 真机对端实测）。
# https 官方控制面不受影响（scheme 已是 https，仍走证书校验）。
# 此处仅作 feature 统一（不直接调用），挂在 rillane-protocols 上。
ts_control = { version = "0.7", features = ["insecure-keyfetch"] }
defguard_wireguard_rs = "0.11"
# Tailcat（RIL-127）：库承载 mesh 传输面（出口）——tailcat-client 0.1.1
# （kosumic/whip，MIT，纯 Rust，feature 门控瘦传输；ClientCache::connect +
# Client::dial_tcp -> Stream，数据面 boringtun（default_features=False）
# WireGuard + smoltcp 0.14 用户态栈 + DERP 中继；rustls 0.23 / tokio-rustls
# 0.26 经本仓 [patch.crates-io] rustls fork 统一解析（同 tailscale）。客户
# 端面（出口）载具；入口（服务端）面无可用载具——`tailcat` 0.1.0
# （spullara/tailcat-rs，BSD-3，双面 + 官方 Go 互通套件）被 ssh-key 精确
# rc 冲突硬阻断（russh 0.63.1 需 ssh-key =rc.11，工作区为 RIL-113 钉
# =rc.12，两 russh major 各自精确 rc 不可统一）。评估留证
# protocol-backends.md#tailcat
tailcat-client = "0.1"
x509-parser = "0.16"
time = "0.3"
# VMess AEAD（RustCrypto 面：GCM/ChaCha20Poly1305/SHAKE128/ECB 单块/IEEE CRC32）
aes = "0.8"
aes-gcm = "0.10"
# chacha20poly1305 0.10：XChaCha20Poly1305 无条件导出（Mieru 出站
# outbound/mieru.rs 用其 24 字节 nonce AEAD——官方 protocol.md 口径）
chacha20poly1305 = "0.10"
sha3 = "0.10"
crc32fast = "1.4"
# REALITY 认证（RIL-107，xray REALITY 语义）：x25519 认证 ECDH + HKDF-SHA256
# （info="REALITY"）派生 + AES-256-GCM session-id seal/open（AAD=ClientHello
# session-id 槽置零）+ HMAC-SHA512 证书绑定；ed25519-dalek 供测试对端
# CertificateVerify 签名（纯 Rust 面，aws-lc-rs 仅经 rustls fork 特性进入）
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
hmac = "0.12"
# REALITY HMAC 证书绑定的恒时比较面（Go hmac.Equal 口径）
subtle = { version = "2", default-features = false }
# GeoIP/GeoSite database access (G0-2): maxminddb for GeoLite2/GeoIP2 .mmdb
# and geosite-rs for v2fly .dat (both geoip and geosite protobuf formats).
maxminddb = "0.32"
geosite-rs = "0.1.6"
# Test-only writer to synthesize a small .mmdb without external files.
maxminddb-writer = "0.1.3"

# Cloudflared（RIL-128）：库承载的 Cloudflare Tunnel 客户端——quick/named
# 隧道 + QUIC(quinn)/HTTP2 edge + 重连退避 + TCP/WS/HTTP origin（载具评估
# 见 protocol-backends.md#cloudflared）；Apache-2.0；伴生 libcfd-rpc(capnp
# 缺编译器回退 committed pregenerated=零安装面)；rustls 0.23 ring 经本仓
# [patch.crates-io] fork 统一解析（quinn ^0.11.11 与工作区 0.11.9 归并）
libcfd = "0.2.0"

# REALITY 传输面（RIL-107）：cfal/rustls fork——上游 049d39b9（0.23.46）+
# 5 个 REALITY 提交（ClientHooks/new_reality/PreparedServerHello/隔离加固），
# 固定 rev 全仓换用；选库评估见 docs/zh/protocol-backends.md#vless。
# fork 的 REALITY 面不认证对端——认证与证书绑定由 rillane-protocols 装配。
# 记录层填充仅 aws_lc_rs 后端实现（ring 默认实现拒绝非零填充）。
[patch.crates-io]
rustls = { git = "https://github.com/cfal/rustls", rev = "d17d0fc304c03fe6e2c96ade6cd39c33b951c3af" }
