[package]
name = "rillane-protocols"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes.workspace = true
base64.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
argon2.workspace = true
russh.workspace = true
ssh-key.workspace = true
arti-client.workspace = true
tor-chanmgr.workspace = true
tor-rtcompat.workspace = true
libsqlite3-sys.workspace = true
toml.workspace = true
sha3.workspace = true
aes.workspace = true
aes-gcm.workspace = true
chacha20poly1305.workspace = true
crc32fast.workspace = true
httparse.workspace = true
h2.workspace = true
http.workspace = true
pin-project-lite.workspace = true
uuid.workspace = true
rand.workspace = true
url.workspace = true
rillane-core = { path = "../rillane-core" }
rillane-config = { path = "../rillane-config" }

# TLS support
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

# OpenConnect CSTP layer-3 bridge (userspace IP stack)
smoltcp.workspace = true

# OpenVPN（RIL-122）：corevpn-protocol 0.6.0 库承载——协议会话/双角色/TLS
# 面/KeyMethodV2/PUSH_REPLY（载具经 [patch.crates-io] rustls fork 解析）；
# corevpn-crypto 直挂（CipherSuite/KeyMaterial/HmacAuth/openvpn_prf/random_bytes）
corevpn-protocol.workspace = true
corevpn-crypto.workspace = true

# Tailscale（RIL-123）：tailscale 0.7.1 库承载——Device/tcp_connect/netstack
# （ts_netstack_smoltcp，AsyncRead/AsyncWrite；载具 rustls 经 [patch.crates-io]
# fork 解析，ts_tls_util 骑 tokio-rustls 0.26）
tailscale.workspace = true
# 载具子层 feature 统一：insecure-keyfetch 使控制面 key 获取沿用用户给定的 URL
# scheme（否则无条件改写 https，自托管明文 headscale 会 TLS 握手失败，见 RIL-123
# 真机对端实测）。仅作 feature 开关，不直接调用。
ts_control.workspace = true

# SOCKS5 client
tokio-socks.workspace = true

# Shadowsocks
shadowsocks.workspace = true

# Hysteria2（RIL-133/138 自写面：QUIC 承载 + HTTP/3 认证 + 线格式镜像）
quinn.workspace = true
h3.workspace = true
h3-quinn.workspace = true

# AnyTLS（RIL-106）
anytls.workspace = true

# ShadowQUIC（RIL-118）：库承载出站——协议自身 Rust 实现（唯一 crates.io
# 落点），缺省特性即探针实测面；评估与探针留证 protocol-backends.md#shadowquic
shadowquic.workspace = true

# REALITY 认证与传输适配（RIL-107）：见 outbound/reality.rs
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
hkdf.workspace = true
subtle.workspace = true
x509-parser.workspace = true

# android 不编 wireguard（defguard_boringtun 无平台支撑，见 outbound/wireguard_stub.rs）；
# armv7-ohos 同因剥离（boringtun epoll.rs 的 libc::timespec 字面量撞 32 位 ohos libc
# 私有 __pad0 字段，E0451；aarch64/x86_64-ohos 上 boringtun 实测可编，不回退，见
# platforms/ohos/README.md 踩坑实录）；target 段置尾，防吞后续公共依赖（TOML 表语义）
[target.'cfg(not(any(target_os = "android", all(target_os = "linux", target_env = "ohos", target_arch = "arm"))))'.dependencies]
defguard_wireguard_rs.workspace = true

[dev-dependencies]
# §8.2 mock TLS 服务端（自签证书）
rcgen.workspace = true
# RIL-106 真实对端：库自带 AnyTLS 服务端面（Session::new_server/accept_stream）
anytls = { workspace = true, features = ["server"] }
