[package]
name = "rillane-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "RILLANE 移动端 FFI：C ABI 最小通路（P3-4）——cdylib 供 Android JNI / iOS NEPacketTunnel 接入"

[lib]
# cdylib：Android/iOS 侧动态库；rlib：宿主机测试与复用
crate-type = ["cdylib", "rlib"]

# 构建档位（RIL-040）：`full` 挂 wasmtime/JIT；mobile 档 = 无 WASM 插件面
# （small 语义同名转发——移动 cdylib 依赖图无 wasmtime）。default = full 档，
# 移动宿主构建须 `--no-default-features --features mobile`。
[features]
default = ["full"]
full = ["rillane-runtime/plugins"]
mobile = ["rillane-runtime/small"]

[dependencies]
rillane-config = { path = "../rillane-config" }
# RIL-150：诊断查询面（FlowId/FlowQueryService/trace_json 发射器）——
# 控制面 /trace/* 与 FFI 同一查询契约
rillane-core = { path = "../rillane-core" }
rillane-runtime = { path = "../rillane-runtime", default-features = false }
anyhow.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# JNI 桥（Kotlin System.loadLibrary 直连）；仅 android 目标编译，宿主面零负担
jni = "0.21"
