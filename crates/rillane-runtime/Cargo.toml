[package]
name = "rillane-runtime"
version = "0.1.0"
edition = "2021"

# 构建档位（RIL-040）：`plugins` 挂 wasmtime/JIT（WASM 插件中间件）。
# default = full 档；small/mobile 档须 `--no-default-features --features small`
# （cargo feature 叠加语义下，small 不关 default 仍是全量）——small 依赖图
# 无 wasmtime/JIT；obfs.plugins 声明在 small 档点名硬错误，不是隐藏配置入口。
[features]
default = ["plugins"]
plugins = ["dep:rillane-plugins"]
small = []
mobile = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
dashmap.workspace = true
smoltcp.workspace = true
petgraph.workspace = true
uuid.workspace = true
rillane-config = { path = "../rillane-config" }
rillane-core = { path = "../rillane-core" }
rillane-platform = { path = "../rillane-platform" }
rillane-protocols = { path = "../rillane-protocols" }
rillane-routing = { path = "../rillane-routing" }
rillane-telemetry = { path = "../rillane-telemetry" }
rillane-mesh = { path = "../rillane-mesh" }
rillane-subscription = { path = "../rillane-subscription" }
rillane-plugins = { path = "../rillane-plugins", optional = true }
notify.workspace = true
futures.workspace = true
whoami.workspace = true
num_cpus.workspace = true
regex.workspace = true
chrono.workspace = true
sha2.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
aes.workspace = true
libc = "0.2"
rustls.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true

[dev-dependencies]
# P3-2（plugin-loader.md §4.3）：链装配测试以最小 wat 内联模块产出 .wasm 落盘；
# 版本随 wasmtime 所引（Cargo.lock wat 1.261.0），复用同份缓存
wat = "1.261"
# mesh mTLS 重载路径回归测试以 rcgen 自签证书为夹具。
rcgen.workspace = true
