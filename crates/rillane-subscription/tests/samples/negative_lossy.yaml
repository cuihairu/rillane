# RIL-007 订阅兼容样本：full-policy 有损反例（已脱敏）
# 预期（宽松模式）：损失清单非空——
#   丢弃节点 good-node-*（port: 0 无效）与 sample-snell（类型暂不支持）
#   降级组 fb-group（fallback→Random）与 relay-group（relay→ConsistentHash）
#   跳过规则 rule-1（PROCESS-NAME 暂不支持）与 rule-2（RULE-SET 暂不支持）
# 预期（严格模式）：整体拒绝，错误含完整损失清单。
proxies:
  - name: good-node-a
    type: ss
    server: 203.0.113.10
    port: 8388
    cipher: aes-256-gcm
    password: "REDACTED-SAMPLE"
  - name: bad-port-node
    type: ss
    server: 203.0.113.11
    port: 0
    cipher: aes-256-gcm
    password: "REDACTED-SAMPLE"
  - name: sample-snell
    type: snell
    server: 203.0.113.12
    port: 6160
    password: "REDACTED-SAMPLE"
proxy-groups:
  - name: MAIN
    type: select
    proxies:
      - good-node-a
      - fb-group
  - name: fb-group
    type: fallback
    proxies:
      - good-node-a
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: relay-group
    type: relay
    proxies:
      - good-node-a
rules:
  - PROCESS-NAME,game.exe,MAIN
  - RULE-SET,ads,MAIN
  - DOMAIN-SUFFIX,example.com,MAIN
  - MATCH,MAIN
