# RIL-007 订阅兼容样本：full-policy 有损反例（已脱敏）
# 预期（宽松模式）：损失清单非空——
#   丢弃节点 good-node-*（port: 0 无效）与 sample-snell（类型暂不支持）
#   （组面自 RIL-013 起零损失：fallback 同语义直映，relay 明确拒绝不属宽松降级样本——
#    relay 拒绝见 clash_guardrails::relay_group_rejected_in_both_modes）
#   跳过规则 rule-2（未声明的 RULE-SET 引用）；降级规则 rule-1（进程规则引擎降级，RIL-015）
# 预期（严格模式）：整体拒绝，错误含完整损失清单。
proxies:
  - name: good-node-a
    type: ss
    server: 203.0.113.10
    port: 8388
    cipher: aes-256-gcm
    password: "REDACTED-SAMPLE"
  - name: bad-port-node
    type: ss
    server: 203.0.113.11
    port: 0
    cipher: aes-256-gcm
    password: "REDACTED-SAMPLE"
  - name: sample-snell
    type: snell
    server: 203.0.113.12
    port: 6160
    password: "REDACTED-SAMPLE"
proxy-groups:
  - name: MAIN
    type: select
    proxies:
      - good-node-a
      - fb-group
  - name: fb-group
    type: fallback
    proxies:
      - good-node-a
    url: https://www.gstatic.com/generate_204
    interval: 300
#   （组面自 RIL-013 起零损失：fallback 同语义直映，relay 明确拒绝不属宽松降级样本——
#    relay 拒绝见 clash_guardrails::relay_group_rejected_in_both_modes）
rules:
  - PROCESS-NAME,game.exe,MAIN
  - RULE-SET,ads,MAIN
  - DOMAIN-SUFFIX,example.com,MAIN
  - MATCH,MAIN
