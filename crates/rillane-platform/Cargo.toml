[package]
name = "rillane-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
rillane-config = { path = "../rillane-config" }
rillane-core = { path = "../rillane-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
bytes.workspace = true
thiserror.workspace = true
winapi = { version = "0.3", optional = true }
dns-lookup = "3.0"
# set_mark（SO_MARK 旁路面，RIL-020 DNS 上游）在 "all" feature 下
socket2 = { version = "0.5", features = ["all"] }
network-interface = "2.0"
futures.workspace = true
regex.workspace = true
base64.workspace = true
reqwest.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
rcgen.workspace = true

# Linux TUN 真实现（tun-dataplane.md §1.1 TUNSETIFF ioctl + OwnedFd）；
# 仅 Linux 目标启用，其余平台不引入
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.28", features = ["ioctl", "fs"] }
