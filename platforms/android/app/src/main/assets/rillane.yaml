# RILLANE Android demo 配置（assets 打包，RillaneVpnService 读取后经 FFI start 传入）
# 结构同 config/rillane.yaml 最小面；入口/控制面仅 loopback（app 进程内自用），
# 隧道数据面 = TUN ICMP echo 轮转（真实代理路径随 P1-2 TunIngress 接入）。

control:
  api_bind: 127.0.0.1:9090
  uds_path: null
  admin_token: demo-token

telemetry:
  log_level: info
  enable_metrics: false
  enable_tracing: false

ingress:
  - name: socks-in
    type: socks5
    bind: 127.0.0.1:7890

egress:
  - name: direct-main
    type: direct

routing:
  default_node: direct-main
  groups: []
  rules: []
